[tool.uv.workspace]
members = ["packages/python", "packages/server"]
[tool.uv.sources]
openspline = { workspace = true }
openspline-server = { workspace = true }
# Prebuilt wheels match the pinned torch 2.7; the PyPI sdist compiles CUDA kernels for hours.
flash-attn = [
    { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.0.post2/flash_attn-2.8.0.post2+cu12torch2.7cxx11abiTRUE-cp310-cp310-linux_x86_64.whl", marker = "python_version == '3.10'" },
    { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.0.post2/flash_attn-2.8.0.post2+cu12torch2.7cxx11abiTRUE-cp311-cp311-linux_x86_64.whl", marker = "python_version == '3.11'" },
    { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.0.post2/flash_attn-2.8.0.post2+cu12torch2.7cxx11abiTRUE-cp312-cp312-linux_x86_64.whl", marker = "python_version == '3.12'" },
]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1", "ruff>=0.11,<1", "build>=1,<2", "jsonschema>=4.25,<5"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"packages/server/src/openspline_server/_vendor/**" = ["ALL"]
